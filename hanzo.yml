# Canonical CI/CD config for hanzoai/lint-staged — read by hanzoai/ci (via
# .hanzo/workflows/cicd.yml) and by platform.hanzo.ai.
#
# Library (npm). Plain JS with JSDoc types checked by tsconfig, so `tsc` IS the
# compile — it is the only thing that catches a type break in this repo — and
# the unit suite covers the logic. The e2e/integration suites are left out on
# purpose: they shell out to real git repositories, which tests git, not this.
test:
  - name: typecheck-and-unit
    run: npm ci --no-audit --no-fund && npm run typecheck && npx vitest run test/unit
